version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: gestion-tienda-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gestion_tienda
      MYSQL_USER: tienda_user
      MYSQL_PASSWORD: tienda_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    name: gestion-tienda-mysql-data
