name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    name: Lint, migrate, test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gestion_tienda_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/gestion_tienda_test
      NODE_DEV: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificar formato (Prettier)
        run: npx prettier --check .

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Esperar a que MySQL esté listo
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 3
          done

      - name: Aplicar migraciones Prisma
        run: npx prisma migrate deploy

      - name: Ejecutar tests (unitarios e integración)
        run: npm run test

      - name: Compilar TypeScript
        run: npm run build

      - name: Verificación de sintaxis del punto de entrada
        run: node --check dist/main.js

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7
